# CI pipeline. Despite ROADMAP.md's Stage 10 write-up describing this as
# already shipped, no workflow file existed in the repo before this one —
# see the dead-code/CI audit in the project history. This workflow is
# what that write-up describes: fmt, vet, staticcheck, unit tests, race
# tests, integration tests against a real Postgres service container, and
# a Docker build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.22"

jobs:
  lint:
    name: fmt / vet / staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt (fails on unformatted files)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: "2024.1"
          install-go: false

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...

  test:
    name: unit + race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...

  integration:
    name: dbstore integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teahub_test
          POSTGRES_PASSWORD: teahub_test
          POSTGRES_DB: teahub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teahub_test -d teahub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test ./backend/internal/dbstore/...
        env:
          TEAHUB_TEST_DATABASE_URL: postgres://teahub_test:teahub_test@localhost:5432/teahub_test?sslmode=disable
        run: go test ./backend/internal/dbstore/... -v -count=1

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: teahub:ci
          build-args: |
            TEAHUB_VERSION=${{ github.sha }}
